services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: vectrieve-qdrant
    restart: always
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage

  db:
    image: postgres:15-alpine
    container_name: vectrieve-postgres
    restart: always
    environment:
      POSTGRES_USER: vectrieve
      POSTGRES_PASSWORD: vectrieve_password
      POSTGRES_DB: vectrievedb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vectrieve-backend
    restart: always
    depends_on:
      - qdrant
      - db
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://vectrieve:vectrieve_password@db:5432/vectrievedb
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - CORS_ORIGINS=*
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend_data:/app/data
      - ./backend_logs:/app/logs
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vectrieve-frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://159.89.110.69:8000
      - INTERNAL_BACKEND_URL=http://backend:8000
    ports:
      - "3000:3000"
      - "80:3000"
